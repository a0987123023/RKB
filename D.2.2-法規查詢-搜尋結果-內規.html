<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>D.2.2-法規查詢-搜尋結果-內規</title>
    <style>
      #header-container .frame-2 .div-wrapper:nth-child(1) {
        border-bottom: 4px solid var(--primary600) !important;
        .text-wrapper-2 {
          color: var(--primary600) !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="w-full">
      <div id="header-template"></div>
      <div class="w-full flex">
        <div class="side-nav same-width flex-[10%]">
          <ul>
            <li class="sub1 active">外規列表</li>
            <li class="sub1">內規列表</li>
          </ul>
        </div>
        <div class="main flex-[80%]">
          <div class="breadcrumb">
            <div class="label">
              <p class="div">
                <span class="text-wrapper">首頁</span>
                &nbsp;&nbsp;&gt;&nbsp;&nbsp;
                <span class="text-wrapper active">法規內容管理</span>
              </p>
            </div>
          </div>
          <div id="search-container">
            <div class="search-bar flex">
              <div class="flex-[50%]">
                <div class="flex helper">
                  <label for="" class="text-wrapper text-info">關鍵字</label>
                  <div class="bubble">
                    <img class="img" src="./assets/icons/icon_info.svg" />
                    <div class="speech-bubble">可查詢法規名稱、發文字號...</div>
                  </div>
                </div>
                <input
                  class="w-full"
                  type="text"
                  id=""
                  placeholder="輸入關鍵字"
                />
              </div>

              <div>
                <label for="" class="text-wrapper">法規類型</label>
                <div class="select-content">
                  <select id="">
                    <option selected>全部</option>
                  </select>
                </div>
              </div>

              <div class="date-range min-w-[240px]">
                <label for="" class="text-wrapper">日期區間</label>
                <input type="date" id="start-date" value="2024-12-28" />
              </div>

              <button class="button flex-[8%] max-w-[100px] max-h-[42px]">
                搜尋
              </button>
            </div>
          </div>
          <div id="tab-table-element-2"></div>
        </div>

        <div class="flex-[10%]"></div>
      </div>
    </div>

    <script>
      // 動態載入 HTML 並執行 JavaScript
      function loadComponent(url, containerId) {
        fetch(url)
          .then((response) => response.text())
          .then((data) => {
            const container = document.getElementById(containerId);
            if (!container) {
              console.error(`容器元素 #${containerId} 未找到`);
              return;
            }

            // 建立一個 DOM 解析器
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, "text/html");

            // 插入 <template> 到頁面
            const template = doc.querySelector("template");
            if (template) {
              container.appendChild(template.content.cloneNode(true));
            }

            // 取得 <script> 內容並執行
            const script = doc.querySelector("script");
            if (script) {
              // const newScript = document.createElement("script");
              // newScript.textContent = script.textContent;
              // document.body.appendChild(newScript);
              eval(script.textContent);
            }
          })
          .catch((error) => console.error(`無法載入組件 ${url}:`, error));
      }

      // 載入 header.html
      loadComponent("./components/header.html", "header-template");
      loadComponent("./components/tab-table-2.html", "tab-table-element-2");
    </script>
  </body>
</html>
