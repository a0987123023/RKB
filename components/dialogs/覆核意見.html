<!-- 覆核意見 -->
<template id="review-opinion-overlay-template">
  <style>
    #review-opinion-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      display: none;
      .modal {
        border-radius: var(--border-radius-l);
        width: 100%;
        width: 720px;
        position: relative;
        border: 1px solid var(--darkGrey200, #282f33);
        background: var(--global-09-white, #fff);
        box-shadow: 0px 5px 12px 0px rgba(0, 0, 0, 0.08);
      }

      .modal-header {
        display: flex;
        padding: 16px 20px;
        justify-content: space-between;
        align-items: center;
        align-self: stretch;
        border-bottom: 1px solid var(--darkGrey200, #e1eaef);
      }

      .modal-title {
        color: var(--darkGrey900, #344858);
        text-align: center;
        font-size: var(--font-p-lg);
        font-weight: var(--weight-bold);
        line-height: 24px;
      }

      .modal-content {
        padding: 32px 30px 0;
      }

      .section {
        margin-bottom: 40px;
      }

      .section-title {
        color: var(--darkGrey700, #6c8490);
        font-size: var(--font-p-sm);
        font-weight: var(--weight-bold);
        margin-bottom: 12px;
      }

      .content-box {
        display: flex;
        padding: 12px 16px;
        align-items: center;
        border-radius: var(--border-radius-m);
        background: var(--darkGrey100, #f3f9fc);
      }

      .status-text {
        display: flex;
        align-items: center;
        color: var(--darkGrey800, #576972);
        font-size: var(--font-h6);
        font-weight: var(--weight-medium);
        img {
          margin-right: 8px;
        }
      }

      .modal-footer {
        display: flex;
        padding: 20px 30px;
        justify-content: flex-end;
        align-items: center;
      }

      .close-modal-button {
        display: flex;
        padding: 12px 16px;
        justify-content: center;
        align-items: center;
        border-radius: var(--border-radius-m);
        background: var(--Primary600, #009eb8);
        color: var(--White, #fff);
        font-size: var(--font-p-md);
        font-weight: var(--weight-bold);
      }
    }
    #review-opinion-overlay.open {
      display: flex;
    }
  </style>
  <div id="review-opinion-overlay" class="review-opinion-overlay">
    <div class="modal">
      <header class="modal-header">
        <p></p>
        <h2 class="modal-title">覆核意見</h2>
        <button class="close-button overlay-close">
          <img src="./assets/icons/general_cancel.svg" alt="" />
        </button>
      </header>

      <div class="modal-content">
        <section class="section">
          <h3 class="section-title">覆核結果</h3>
          <div class="content-box">
            <div class="status-text">
              <img src="./assets/icons/warning.svg" alt="" />
              <span>未通過</span>
            </div>
          </div>
        </section>

        <section class="section">
          <h3 class="section-title">退回原因</h3>
          <div class="content-box">內容缺漏，待補件</div>
        </section>

        <section class="section">
          <h3 class="section-title">覆核意見</h3>
          <div class="content-box">請補充附件後再重新送單</div>
        </section>
      </div>

      <footer class="modal-footer">
        <button class="close-modal-button overlay-close">關閉</button>
      </footer>
    </div>
  </div>
</template>

<script>
  const closeModal = document.querySelectorAll(".overlay-close"); // 所有彈窗得關閉功能
  const reviewOpinionOverlay = document.querySelector(
    "#review-opinion-overlay"
  );
  // 點擊所有彈窗的取消和X按鈕
  closeModal.forEach((btn) => {
    btn.addEventListener("click", function () {
      reviewOpinionOverlay.classList.remove("open");
    });
  });
  class reviewOpinionOverlayElement extends HTMLElement {
    constructor() {
      super();
      const template = document.getElementById(
        "review-opinion-overlay-template"
      ).content;
      const shadowRoot = this.attachShadow({ mode: "open" });
      shadowRoot.appendChild(template.cloneNode(true));
    }
  }
  customElements.define(
    "review-opinion-overlay-element",
    reviewOpinionOverlayElement
  );
</script>
