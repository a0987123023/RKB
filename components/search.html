<template id="search-template">
  <div id="search-container">
    <div class="search-bar flex">
      <div class="flex-[15%]">
        <div class="flex helper">
          <label for="" class="text-wrapper text-info">關鍵字</label>
          <div class="bubble">
            <img class="img" src="./assets/icons/icon_info.svg" />
            <div class="speech-bubble">可查詢法規名稱、發文字號...</div>
          </div>
        </div>
        <input class="w-full" type="text" id="" placeholder="輸入關鍵字" />
      </div>

      <div class="flex-[15%]">
        <label for="" class="text-wrapper">主管機關</label>
        <div class="select-content">
          <select id="">
            <option selected>所有機關</option>
          </select>
        </div>
      </div>

      <div class="flex-[15%]">
        <label for="" class="text-wrapper">處理進度</label>
        <div class="select-content">
          <select id="">
            <option selected>請選擇</option>
          </select>
        </div>
      </div>

      <div class="flex-[10%]">
        <label for="" class="text-wrapper">負責承辦</label>
        <div class="select-content">
          <select id="">
            <option selected>請選擇</option>
          </select>
        </div>
      </div>

      <div class="date-range min-w-[240px] flex-[20%]">
        <label for="" class="text-wrapper">日期時間</label>
        <input type="date" id="start-date" value="2024-12-28" />
      </div>

      <button class="button flex-[8%] max-w-[100px] max-h-[42px]">搜尋</button>
    </div>
  </div>
</template>
<script>
  class SearchElement extends HTMLElement {
    constructor() {
      super();
      const template = document.getElementById("search-template").content;
      const shadowRoot = this.attachShadow({ mode: "open" });
      shadowRoot.appendChild(template.cloneNode(true));
    }
  }
  customElements.define("search-element", SearchElement);
</script>
