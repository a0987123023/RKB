<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>C.11-內規列表</title>
    <style>
      #header-container .frame-2 .div-wrapper:nth-child(3) {
        border-bottom: 4px solid var(--primary600) !important;
        color: var(--primary600) !important;
      }
    </style>
  </head>
  <body>
    <div class="w-full">
      <div id="header-template"></div>
      <div class="w-full flex">
        <div class="side-nav same-width flex-[10%]">
          <ul>
            <li class="sub1 active">外規列表</li>
            <li class="sub1">內規列表</li>
          </ul>
        </div>
        <div class="main flex-[80%]">
          <div class="breadcrumb">
            <div class="label">
              <p class="div">
                <span class="text-wrapper">首頁</span>
                &nbsp;&nbsp;&gt;&nbsp;&nbsp;
                <span class="text-wrapper active">法規內容管理</span>
              </p>
            </div>
          </div>
          <div id="search-template"></div>
          <div id="tab-table-element"></div>
        </div>

        <div class="flex-[10%]"></div>
      </div>
    </div>

    <script>
      // 動態載入 HTML 並執行 JavaScript
      function loadComponent(url, containerId) {
        fetch(url)
          .then((response) => response.text())
          .then((data) => {
            const container = document.getElementById(containerId);
            if (!container) {
              console.error(`容器元素 #${containerId} 未找到`);
              return;
            }

            // 建立一個 DOM 解析器
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, "text/html");

            // 插入 <template> 到頁面
            const template = doc.querySelector("template");
            if (template) {
              container.appendChild(template.content.cloneNode(true));
            }

            // 取得 <script> 內容並執行
            const script = doc.querySelector("script");
            if (script) {
              // const newScript = document.createElement("script");
              // newScript.textContent = script.textContent;
              // document.body.appendChild(newScript);
              eval(script.textContent);
            }
          })
          .catch((error) => console.error(`無法載入組件 ${url}:`, error));
      }

      // 載入 header.html
      loadComponent("./components/header.html", "header-template");
      loadComponent("./components/search.html", "search-template");
      loadComponent("./components/tab-table.html", "tab-table-element");
    </script>
  </body>
</html>
