<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/main.css" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>D.1-法規查詢模組</title>
    <style>
      #header-container .frame-2 .div-wrapper:nth-child(1) {
        border-bottom: 4px solid var(--primary600) !important;
        .text-wrapper-2 {
          color: var(--primary600) !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="w-full">
      <div id="header-template"></div>
      <div class="w-full flex">
        <div class="side-nav same-width flex-[10%]">
          <ul>
            <li class="sub1 active">外規列表</li>
            <li class="sub1">內規列表</li>
          </ul>
        </div>
        <div class="main flex-[80%]">
          <div class="breadcrumb">
            <div class="label">
              <p class="div">
                <span class="text-wrapper">首頁</span>
                &nbsp;&nbsp;&gt;&nbsp;&nbsp;
                <span class="text-wrapper active">法規內容管理</span>
              </p>
            </div>
          </div>
          <div id="search-container">
            <div class="search-bar flex">
              <div class="flex-[50%]">
                <div class="flex helper">
                  <label for="" class="text-wrapper text-info">關鍵字</label>
                  <div class="bubble">
                    <img class="img" src="./assets/icons/icon_info.svg" />
                    <div class="speech-bubble">可查詢法規名稱、發文字號...</div>
                  </div>
                </div>
                <div class="keyword-input-container">
                  <input
                    id="keyword-input"
                    class="w-full"
                    type="text"
                    placeholder="輸入關鍵字"
                    autocomplete="off"
                  />
                  <div
                    id="suggestions-container"
                    class="suggestions-container"
                  ></div>
                </div>
              </div>

              <div>
                <label
                  for="regulation-type"
                  class="text-wrapper"
                  id="label-regulation-type"
                  class="text-wrapper"
                  >法規類型</label
                >
                <div id="regulation-type"></div>
              </div>

              <div class="date-range min-w-[240px]">
                <label for="" class="text-wrapper">日期區間</label>
                <input type="date" id="start-date" value="2024-12-28" />
              </div>

              <button class="button flex-[8%] max-w-[100px] max-h-[42px]">
                搜尋
              </button>
            </div>
          </div>
          <div class="linear-card">
            <!-- 進入頁面沒資料時顯示 start -->
            <div class="no-data-area">
              <img src="./assets/icons/illustration_search.svg" alt="" />
              <div class="text">開始搜尋法規</div>
            </div>
            <!-- 進入頁面沒資料時顯示 end -->
            <!-- 按查詢沒資料時顯示 start -->
            <div class="no-data-area">
              <img src="./assets/icons/illustration_lighthouse.svg" alt="" />
              <div class="text">查無「」結果，請確認關鍵字無誤後再重新搜尋</div>
            </div>
            <!-- 按查詢沒資料時顯示 end -->
            <!-- 若有資料顯示 start -->
            <div class="data-content">
              <div class="search-history">
                <span class="title">搜尋紀錄</span>
                <span class="clear">清除</span>
              </div>
              <div class="data">
                <div class="item">
                  <span class="text">金融</span>
                </div>
                <div class="item">
                  <span class="text">資料共享業務問答集</span>
                </div>
                <div class="item">
                  <span class="text">投資抵減</span>
                </div>
                <div class="item">
                  <span class="text">資料申報問答集</span>
                </div>
                <div class="item">
                  <span class="text">金融資料共享指引</span>
                </div>
                <div class="item">
                  <span class="text">內部稽核資訊申報格式問答集</span>
                </div>
                <div class="item">
                  <span class="text">內部稽核</span>
                </div>
                <div class="item">
                  <span class="text">資產處理準則</span>
                </div>
                <div class="item">
                  <span class="text"
                    >金融機構作業委託他人處理內部作業制度及程序辦法</span
                  >
                </div>
                <div class="item">
                  <span class="text">金融消費者服務法</span>
                </div>
              </div>
            </div>
            <!-- 若有資料顯示 end -->
          </div>
        </div>

        <div class="flex-[10%]"></div>
      </div>
    </div>

    <script src="./composable/input/keyword-search-input.js"></script>
    <script src="./composable/input/select-input.js"></script>
    <script>
      // 動態載入 HTML 並執行 JavaScript
      function loadComponent(url, containerId) {
        fetch(url)
          .then((response) => response.text())
          .then((data) => {
            const container = document.getElementById(containerId);
            if (!container) {
              console.error(`容器元素 #${containerId} 未找到`);
              return;
            }

            // 建立一個 DOM 解析器
            const parser = new DOMParser();
            const doc = parser.parseFromString(data, "text/html");

            // 插入 <template> 到頁面
            const template = doc.querySelector("template");
            if (template) {
              container.appendChild(template.content.cloneNode(true));
            }

            // 取得 <script> 內容並執行
            const script = doc.querySelector("script");
            if (script) {
              // const newScript = document.createElement("script");
              // newScript.textContent = script.textContent;
              // document.body.appendChild(newScript);
              eval(script.textContent);
            }
          })
          .catch((error) => console.error(`無法載入組件 ${url}:`, error));
      }

      // 載入 header.html
      loadComponent("./components/header.html", "header-template");

      // 頁面加載完成後初始化關鍵字搜尋組件
      document.addEventListener("DOMContentLoaded", function () {
        // 實際應該來自API
        const allRegulations = [
          "金融監督管理委員會證券期貨局組織法",
          "金融資產證券化條例",
          "金融消費者保護法",
          "金融機構合併法",
          "金融監督管理委員會檢查局組織法",
          "金融消費者服務法",
          "證券交易法",
          "保險法",
          "信託業法",
          "票券金融管理法",
          "電子支付機構管理條例",
          "資料共享業務問答集",
          "投資抵減",
          "資料申報問答集",
          "金融資料共享指引",
          "內部稽核資訊申報格式問答集",
          "內部稽核",
          "資產處理準則",
          "金融機構作業委託他人處理內部作業制度及程序辦法",
        ];

        // 初始化關鍵字搜尋組件
        const keywordSearch = new KeywordSearch({
          container: "#search-container",
          inputSelector: "#keyword-input",
          suggestionsSelector: "#suggestions-container",
          dataSource: allRegulations,
          onSelect: (selectedText) => {
            console.log("選擇了:", selectedText);
          },
        });
      });

      // 創建法規類型下拉選單
      const dropdown = new CustomDropdown({
        container: "#regulation-type",
        labelId: "label-regulation-type", // 關聯的label ID
        items: ["全部", "內規", "法規", "函釋", "其他"],
        placeholder: "請選擇",
        onChange: function (value) {
          console.log("選擇了:", value);
        },
      });
    </script>
  </body>
</html>
